name: Android integration checks

on:
  push:
    branches:
      - main
      - integration/anythingllm-gpl
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: yarn

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --network-timeout 300000

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Type-check JavaScript
        run: yarn typecheck

      - name: Run JavaScript tests
        run: yarn test --runInBand

      - name: Run Android tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build standalone release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Package standalone install ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          apk = Path("app/build/outputs/apk/release/app-release.apk")
          digest = hashlib.sha256()
          with apk.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)

          install = """Shbeeb AI + AnythingLLM — APK مستقل للتجربة

          1. فك ضغط هذا الملف.
          2. ثبّت app-release.apk على جهاز Android.
          3. هذه حزمة اختبار موقعة بمفتاح Android debug الافتراضي، وليست إصداراً للنشر التجاري.
          4. تحتوي الحزمة JavaScript داخل APK ولا تحتاج إلى خادم Metro.
          5. إذا ظهر تعارض توقيع مع نسخة سابقة، احفظ بياناتك أولاً ثم أزل النسخة السابقة.
          6. تحقّق من SHA256SUMS.txt عند نقل الملف.
          """
          package = apk.parent / "anythingllm-and-shbeeb-standalone.zip"
          with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_STORED) as archive:
              archive.write(apk, "app-release.apk")
              archive.writestr("INSTALL_AR.txt", install.encode("utf-8"))
              archive.writestr("SHA256SUMS.txt", f"{digest.hexdigest()}  app-release.apk\n")
          print(f"Created {package} ({package.stat().st_size} bytes)")
          PY

      - name: Upload standalone test package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anythingllm-and-shbeeb-standalone-package
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/anythingllm-and-shbeeb-standalone.zip
          if-no-files-found: error
