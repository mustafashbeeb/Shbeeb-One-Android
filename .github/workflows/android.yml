name: Android integration checks

on:
  push:
    branches:
      - main
      - integration/anythingllm-gpl
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: yarn

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --network-timeout 300000

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Type-check JavaScript
        run: yarn typecheck

      - name: Run JavaScript tests
        run: yarn test --runInBand

      - name: Run Android tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anythingllm-and-shbeeb-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
